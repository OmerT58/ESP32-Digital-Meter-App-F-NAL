name: digital_meter_sim
description: IoT Digital Meter — ESP32-S3 BLE companion app with AR camera overlay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.0
  provider: ^6.1.2
  vector_math: ^2.1.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  camera: ^0.11.0+2
  permission_handler: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#0F1117"
  adaptive_icon_foreground: assets/logo.png

flutter_native_splash:
  color: "#0F1117"
  image: assets/logo.png
  android_12:
    color: "#0F1117"
    icon_background_color: "#0F1117"
    image: assets/logo.png